spring:
  application:
    name: restaurant-booking
  datasource:
    url: jdbc:mysql://localhost:3306/restaurant_booking
    username: ${DB_USERNAME:booking_app}
    password: ${DB_PASSWORD:change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info